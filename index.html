<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Rent Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1f2933; }
  #map { height: 100%; }
  .leaflet-tile-pane { filter: grayscale(1) opacity(.7); } /* mute the basemap so rail colours stand out */
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000; width: 220px;
    max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box;
    background: #fff; border-radius: 8px; padding: 12px 14px; box-shadow: 0 1px 6px rgba(0,0,0,.25);
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; cursor: pointer; user-select: none; }
  #collapse { margin-left: auto; display: flex; border: 0; background: none; padding: 2px; color: #6b7785; cursor: pointer; }
  #collapse svg { display: block; }
  #panel.collapsed #collapse svg { transform: rotate(-90deg); }
  #panel h1:hover #collapse { color: #1f2933; }
  #panel.collapsed { width: auto; }
  #panel.collapsed h1 { margin: 0; gap: 10px; }
  #panel.collapsed > :not(h1) { display: none; }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7785; margin: 12px 0 4px; }
  #panel label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  #panel .count { margin-left: auto; color: #6b7785; font-variant-numeric: tabular-nums; }
  #search { display: flex; gap: 4px; }
  #search input { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #c5ccd3; border-radius: 4px; font: inherit; }
  #search-status { font-size: 11px; color: #b42318; }
  /* proximity: 6px between pins < 8px to the input < 16px to the next section */
  #pins:not(:empty) { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 16px; }
  #pins div { display: flex; align-items: center; }
  #pins span { flex: 1; cursor: pointer; }
  #pins button { border: 0; background: none; padding: 0 4px; font: inherit; color: #6b7785; cursor: pointer; }
  #pins button:hover { color: #b42318; }
  #panel footer { margin-top: 10px; font-size: 11px; color: #6b7785; }
  .poi {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); box-sizing: border-box;
  }
  .poi { font-weight: 700; line-height: 1; }
  .poi.key { width: 18px; height: 18px; font-size: 10px; flex: none; }
  .popup-title { font-weight: 600; font-size: 14px; }
  .popup-sub { color: #6b7785; }
  .chip { display: inline-block; padding: 0 6px; margin: 3px 3px 0 0; border-radius: 9px; color: #fff; font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Legend <button id="collapse" title="Collapse" aria-expanded="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button></h1>
  <form id="search"><input placeholder="Postcode, e.g. E8 3DL" autocomplete="off" spellcheck="false"></form>
  <div id="search-status"></div>
  <div id="pins"></div>
  <h2>Places</h2>
  <div id="categories"></div>
  <footer id="generated"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------------------------------------------------------------------------
// CONFIG: categories and styling. Edit freely, no re-fetch or reindex needed.
// data.json only holds facts (dataset, name, lat, lon, props); everything about
// how features are grouped and drawn is decided here.
// ---------------------------------------------------------------------------

// A point goes to the first category whose match() returns true.
// icon: emoji or letter shown in a coloured circle. icon: null draws a small dot instead.
// hover: for dots, the radius in pixels of the area that reacts to the mouse, bigger than the dot so it is easy to hit.
// transit: true puts the points under the public transport checkbox instead of their own.
// text: optional letter colour (default white).
const categories = [
  { id: "office",  label: "Offices",  icon: "💼", color: "#1d4ed8", size: 34, on: true, match: p => p.dataset === "offices" },
  { id: "supermarket", label: "Supermarkets", icon: "🛒", color: "#ffd500", size: 22, on: true, match: p => p.dataset === "osm-supermarkets-london" },
  { id: "climbing", label: "Climbing gyms", icon: "🧗", color: "#f97316", size: 24, on: true, match: p => p.dataset === "osm-climbing-london" },
  { id: "station", label: "Stations", icon: null, color: "#333333", size: 3, hover: 9, transit: true, match: p => p.dataset === "tfl-stations" },
];

// Hipster pockets: hex cells where enough weighted places of enough different kinds sit close
// together. These places are not drawn as points (unless a category above also matches them).
const zone = {
  label: "Hipster pockets", color: "#d946ef", on: true,
  cell: 250,      // hex width (distance between neighbouring hex centres), metres
  radius: 500,    // places within this distance of a cell count towards it
  cap: 4,         // max places of one kind counted per cell, so one vintage market does not make a pocket
  minScore: 9,    // cells scoring less are not drawn
  minKinds: 3,    // nor are cells with fewer different kinds around
  fullScore: 22,  // score at which a cell reaches full opacity
  kinds: {        // dataset -> label and weight
    "ect-cafes-london":        { label: "specialty coffee", weight: 2 },
    "osm-climbing-london":     { label: "climbing",         weight: 2 },
    "osm-breweries-london":    { label: "breweries",        weight: 1.5 },
    "osm-record-shops-london": { label: "record shops",     weight: 1.5 },
    "osm-vintage-london":      { label: "vintage",          weight: 1 },
    "osm-bookshops-london":    { label: "bookshops",        weight: 1 },
    "osm-yoga-london":         { label: "yoga / pilates",   weight: 1 },
  },
};

// Parks: a faint green over the muted basemap, just enough to tell them apart. No hover. Parks, commons and nature reserves from OpenStreetMap.
const parks = {
  label: "Parks", color: "#16a34a", opacity: 0.2, on: true, dataset: "osm-parks-london",
  minHa: 1, // smaller ones are not drawn, 1 hectare is a bit more than a football pitch
};

// No-go wards: the few wards where crime that hurts residents is dense and is not just a busy high street.
// score = harm crimes per km² over the last 12 months x (1 - share of the ward's crime that is crowd theft).
// The second factor discounts the West End and other shopping and nightlife centres, where the numbers
// follow the crowds. Only real outliers are drawn: wards scoring at least `times` the typical (median)
// London ward. Kinds are Met SubGroup names, the full list is in data/met-crime-wards.csv.
const crime = {
  label: "Crime", color: "#111827", on: true, dataset: "ons-wards-london",
  times: 3.5,       // a ward is drawn when its score is this many times the typical ward's, 3.5 gives about 25 wards
  minOpacity: 0.3,  // fill opacity of the mildest ward drawn
  maxOpacity: 0.6,  // and of the worst
  others: 5,        // how many of the kinds that are not counted the tooltip lists, biggest first
  harm: [
    "VIOLENCE WITH INJURY", "ROBBERY OF PERSONAL PROPERTY", "POSSESSION OF WEAPONS", "TRAFFICKING OF DRUGS",
    "RES BURGLARY OF A HOME", "BURGLARY - RESIDENTIAL", "ARSON", "HOMICIDE", "RAPE",
  ],
  crowd: ["SHOPLIFTING", "THEFT FROM THE PERSON", "OTHER THEFT", "BURGLARY BUSINESS AND COMMUNITY", "ROBBERY OF BUSINESS PROPERTY"],
};

// Social housing: wards where a large share of households rent from the council or a housing association,
// drawn as outlines so they sit over the crime shading. Census 2021 (TS054 Tenure) per 2022 ward; the London
// median ward is about 20%. In this data the share tracks the crime score (rank correlation about 0.65) and
// 22 of the 24 shaded wards are above the median, though both also follow how dense and central a ward is.
const social = {
  label: "Social housing", color: "#7c3aed", on: true, dataset: "ons-wards-london",
  min: 0.4,     // share of households renting socially for a ward to be outlined, 0.4 gives about 100 wards
  weight: 1.5,  // outline width in pixels
};

// Commute: estimated minutes from every station to every office, shown when hovering a station.
// It is the quickest path over the rail lines on the map: a ride between two neighbouring stations takes
// the straight distance x detour at the mode's speed plus a fixed cost per stop, getting on a train
// (at the start and at every change) costs the mode's board minutes, and the office is walked to from
// any station within maxWalk. Buses and National Rail are not known, so places with a fast mainline
// train (Watford, Cheshunt, Upminster) come out up to 30 minutes too slow. Elsewhere it is typically
// within 3 minutes of the TfL journey planner at 08:30, and within 10 for nine stations in ten.
const commute = {
  to: p => p.dataset === "offices",
  walk: 80,       // walking speed, metres per minute
  crow: 1.3,      // walked distance / straight distance
  maxWalk: 2000,  // furthest station an office is walked to, metres
  maxLink: 500,   // stations closer than this can be changed between on foot, metres
  detour: 1.15,   // track distance / straight distance
  modes: {        // kmh: speed between stops, stop: minutes lost per stop, board: minutes to reach the platform and wait
    "tube":           { kmh: 55, stop: 0.9, board: 4 },
    "dlr":            { kmh: 45, stop: 0.8, board: 4 },
    "elizabeth-line": { kmh: 80, stop: 1.2, board: 5 },
    "overground":     { kmh: 55, stop: 1.2, board: 6 },
  },
};

// All rail lines and the transit categories above share one checkbox.
const transit = { label: "Public transport", icon: "🚇", color: "#333333", on: true };

const lineStyles = {
  "bakerloo":         { color: "#B36305" },
  "central":          { color: "#E32017" },
  "circle":           { color: "#FFD300" },
  "district":         { color: "#00782A" },
  "hammersmith-city": { color: "#F3A9BB" },
  "jubilee":          { color: "#A0A5A9" },
  "metropolitan":     { color: "#9B0056" },
  "northern":         { color: "#000000" },
  "piccadilly":       { color: "#003688" },
  "victoria":         { color: "#0098D4" },
  "waterloo-city":    { color: "#95CDBA" },
  "elizabeth":        { color: "#6950A1" },
  "dlr":              { color: "#00A4A7" },
  "liberty":          { color: "#5D6061" },
  "lioness":          { color: "#FAA61A" },
  "mildmay":          { color: "#0077AD" },
  "suffragette":      { color: "#5BBD72" },
  "weaver":           { color: "#823A62" },
  "windrush":         { color: "#ED1B00" },
};
const defaultLineStyle = { color: "#888888" };

// ---------------------------------------------------------------------------
// APP
// ---------------------------------------------------------------------------

const map = L.map("map", { preferCanvas: true }).setView([51.513, -0.06], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Rail data: TfL · Ward boundaries: ONS · Crime: Met Police · Housing: Census 2021',
}).addTo(map);

// The whole header toggles the panel, the button is there for the keyboard
document.querySelector("#panel h1").onclick = () => {
  const button = document.getElementById("collapse");
  const collapsed = document.getElementById("panel").classList.toggle("collapsed");
  button.title = collapsed ? "Expand" : "Collapse";
  button.setAttribute("aria-expanded", !collapsed);
};

// Postcode search: pins are listed under the input and kept in memory only. Full postcodes ("E8 3DL") and outcodes ("E8") both work
document.getElementById("search").onsubmit = async e => {
  e.preventDefault();
  const status = document.getElementById("search-status");
  const code = e.target.querySelector("input").value.trim().toUpperCase();
  if (!code) return;
  status.textContent = "";
  let found;
  for (const kind of ["postcodes", "outcodes"]) {
    const res = await fetch(`https://api.postcodes.io/${kind}/${encodeURIComponent(code)}`).then(r => r.json()).catch(() => null);
    if (res?.result?.latitude) { found = res.result; break; }
  }
  if (!found) { status.textContent = `No postcode "${code}"`; return; }
  const name = found.postcode ?? found.outcode;
  const pin = L.marker([found.latitude, found.longitude], { zIndexOffset: 1000 })
    .bindPopup(`<div class="popup-title">${name}</div><div class="popup-sub">${[].concat(found.admin_district ?? []).join(", ")}</div>`)
    .addTo(map).openPopup();
  map.setView(pin.getLatLng(), Math.max(map.getZoom(), 15));
  const row = document.createElement("div");
  row.innerHTML = `<span title="Show on map">📍 ${name}</span><button title="Remove">✕</button>`;
  row.querySelector("span").onclick = () => { map.setView(pin.getLatLng(), Math.max(map.getZoom(), 15)); pin.openPopup(); };
  row.querySelector("button").onclick = () => { pin.remove(); row.remove(); };
  document.getElementById("pins").append(row);
  e.target.reset();
};

fetch("data.json").then(r => r.json()).then(data => {
  const lineById = Object.fromEntries(data.lines.map(l => [l.id, l]));

  // Hipster pockets: bin the zone's places into a hex grid, then score each hex by what is within reach.
  // Hexes are pointy-top, addressed by axial coordinates (q, r); the centre of one is at
  // x = zone.cell * (q + r / 2), y = 1.5 * side * r, in metres.
  const mLat = 111320, mLon = 111320 * Math.cos(51.5 * Math.PI / 180); // metres per degree in London
  const side = zone.cell / Math.sqrt(3); // hex centre to corner
  const cells = new Map(); // "q,r" -> { dataset: count }
  for (const p of data.points) {
    if (!zone.kinds[p.dataset]) continue;
    const fr = p.lat * mLat / (1.5 * side), fq = p.lon * mLon / zone.cell - fr / 2;
    let q = Math.round(fq), r = Math.round(fr);
    const t = Math.round(-fq - fr); // third cube coordinate, used to round to the nearest hex
    const eq = Math.abs(q - fq), er = Math.abs(r - fr), et = Math.abs(t + fq + fr);
    if (eq > er && eq > et) q = -r - t;
    else if (er > et) r = -q - t;
    const key = q + "," + r;
    if (!cells.has(key)) cells.set(key, {});
    cells.get(key)[p.dataset] = (cells.get(key)[p.dataset] ?? 0) + 1;
  }
  const reach = 2 * Math.ceil(zone.radius / zone.cell);
  const near = []; // hex offsets whose centres are closer than the radius
  for (let dq = -reach; dq <= reach; dq++) {
    for (let dr = -reach; dr <= reach; dr++) {
      if (Math.hypot(zone.cell * (dq + dr / 2), 1.5 * side * dr) < zone.radius - 1e-6) near.push([dq, dr]);
    }
  }
  const candidates = new Set();
  for (const key of cells.keys()) {
    const [q, r] = key.split(",").map(Number);
    for (const [dq, dr] of near) candidates.add(q + dq + "," + (r + dr));
  }
  zone.layer = L.layerGroup();
  for (const key of candidates) {
    const [q, r] = key.split(",").map(Number);
    const counts = {};
    for (const [dq, dr] of near) {
      const c = cells.get(q + dq + "," + (r + dr));
      for (const d in c) counts[d] = (counts[d] ?? 0) + c[d];
    }
    let score = 0;
    for (const d in counts) score += Math.min(counts[d], zone.cap) * zone.kinds[d].weight;
    if (score < zone.minScore || Object.keys(counts).length < zone.minKinds) continue;
    const strength = Math.min(1, (score - zone.minScore) / (zone.fullScore - zone.minScore));
    const what = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(d => `${counts[d]} ${zone.kinds[d].label}`);
    const cx = zone.cell * (q + r / 2), cy = 1.5 * side * r;
    const corners = [];
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 6 + i * Math.PI / 3;
      corners.push([(cy + side * Math.sin(angle)) / mLat, (cx + side * Math.cos(angle)) / mLon]);
    }
    L.polygon(corners, { stroke: false, fillColor: zone.color, fillOpacity: 0.25 + 0.35 * strength })
      .bindTooltip(`<b>${zone.label}</b><br>${what.join("<br>")}`, { sticky: true }).addTo(zone.layer);
  }
  if (zone.on) zone.layer.addTo(map);

  // Parks
  parks.layer = L.layerGroup();
  for (const a of data.areas) {
    if (a.dataset !== parks.dataset || a.props.area_km2 * 100 < parks.minHa) continue;
    L.polygon(a.polygons, { stroke: false, fillColor: parks.color, fillOpacity: parks.opacity, interactive: false }).addTo(parks.layer);
  }
  if (parks.on) parks.layer.addTo(map);

  // No-go wards: score every ward that has figures (the City of London has its own force and none here), draw the worst
  crime.layer = L.layerGroup();
  const wards = [];
  for (const a of data.areas) {
    if (a.dataset !== crime.dataset || !a.props.crime) continue;
    let harm = 0, crowd = 0, all = 0;
    for (const kind of crime.harm) harm += a.props.crime[kind] ?? 0;
    for (const kind of crime.crowd) crowd += a.props.crime[kind] ?? 0;
    for (const kind in a.props.crime) all += a.props.crime[kind];
    wards.push({ area: a, harm, crowd: crowd / all, score: harm / a.props.area_km2 * (1 - crowd / all) });
  }
  wards.sort((a, b) => b.score - a.score);
  const typical = wards[Math.floor(wards.length / 2)].score;
  const worst = wards[0].score / typical;
  for (const w of wards) {
    const times = w.score / typical;
    if (times < crime.times) break;
    // Tooltip lists what the score counts first, then the biggest of everything else (pickpocketing, shoplifting...)
    const c = w.area.props.crime;
    const byCount = Object.keys(c).filter(k => c[k]).sort((a, b) => c[b] - c[a]);
    const counted = byCount.filter(k => crime.harm.includes(k)).map(k => `${c[k]} ${k.toLowerCase()}`);
    const rest = byCount.filter(k => !crime.harm.includes(k)).slice(0, crime.others).map(k => `${c[k]} ${k.toLowerCase()}`);
    L.polygon(w.area.polygons, { stroke: false, fillColor: crime.color, fillOpacity: crime.minOpacity + (crime.maxOpacity - crime.minOpacity) * (times - crime.times) / (worst - crime.times || 1) })
      .bindTooltip(`<b>${w.area.name}</b>, ${w.area.props.borough}<br>${times.toFixed(1)} times the typical London ward<br>${w.harm} serious crimes a year, ${Math.round(w.harm / w.area.props.area_km2)} per km²${w.area.props.tenure ? `<br>${Math.round(100 * w.area.props.tenure.social_rented / w.area.props.tenure.households)}% of households in social housing` : ""}<br>${counted.join("<br>")}<br><br><b>Not counted</b>, ${Math.round(100 * w.crowd)}% of all crime here is shop and crowd theft<br>${rest.join("<br>")}`, { sticky: true })
      .addTo(crime.layer);
  }
  if (crime.on) crime.layer.addTo(map);

  // Social housing: outline the wards where at least `min` of households rent socially
  social.layer = L.layerGroup();
  for (const a of data.areas) {
    if (a.dataset !== social.dataset || !a.props.tenure) continue;
    const share = a.props.tenure.social_rented / a.props.tenure.households;
    if (share < social.min) continue;
    L.polygon(a.polygons, { color: social.color, weight: social.weight, fill: false })
      .bindTooltip(`<b>${a.name}</b>, ${a.props.borough}<br>${Math.round(100 * share)}% of ${a.props.tenure.households} households rent from the council or a housing association (Census 2021)`, { sticky: true })
      .addTo(social.layer);
  }
  if (social.on) social.layer.addTo(map);

  // Rail lines, all in the transit layer group
  transit.layer = L.layerGroup();
  for (const line of data.lines) {
    const style = lineStyles[line.id] ?? defaultLineStyle;
    L.polyline(line.paths, { color: style.color, weight: 3, opacity: 0.85 })
      .bindTooltip(line.name, { sticky: true })
      .addTo(transit.layer);
  }
  if (transit.on) transit.layer.addTo(map);

  // Commute: quickest path from each office outwards. Nodes are stations ("id"), stations on a line ("id|line")
  // and the office itself; links are [node, minutes] and work both ways.
  const stationById = {};
  for (const l of data.lines) for (const r of l.routes) for (const id of r) stationById[id] = null;
  for (const p of data.points) if (p.id in stationById) stationById[p.id] = p;
  const stationList = Object.values(stationById);
  const metres = (a, b) => Math.hypot((a.lat - b.lat) * mLat, (a.lon - b.lon) * mLon);
  const links = {};
  for (const s of stationList) links[s.id] = [];
  for (const l of data.lines) {
    const mode = commute.modes[l.mode];
    for (const r of l.routes) {
      for (const id of r) {
        if (links[id + "|" + l.id]) continue;
        links[id + "|" + l.id] = [[id, mode.board]];
        links[id].push([id + "|" + l.id, 0]);
      }
      for (let i = 1; i < r.length; i++) {
        const a = r[i - 1] + "|" + l.id, b = r[i] + "|" + l.id;
        const minutes = metres(stationById[r[i - 1]], stationById[r[i]]) * commute.detour / 1000 / mode.kmh * 60 + mode.stop;
        links[a].push([b, minutes]);
        links[b].push([a, minutes]);
      }
    }
  }
  for (const a of stationList) {
    for (const b of stationList) {
      if (a !== b && metres(a, b) < commute.maxLink) links[a.id].push([b.id, metres(a, b) * commute.crow / commute.walk]);
    }
  }
  commute.times = []; // one per office: { name, minutes: { station id: minutes } }
  for (const office of data.points) {
    if (!commute.to(office)) continue;
    const minutes = {}, done = new Set();
    for (const s of stationList) if (metres(office, s) < commute.maxWalk) minutes[s.id] = metres(office, s) * commute.crow / commute.walk;
    for (;;) {
      let u = null;
      for (const k in minutes) if (!done.has(k) && (u === null || minutes[k] < minutes[u])) u = k;
      if (u === null) break;
      done.add(u);
      for (const [v, m] of links[u]) if (minutes[v] == null || minutes[u] + m < minutes[v]) minutes[v] = minutes[u] + m;
    }
    commute.times.push({ name: office.name, minutes });
  }

  // Points, one layer group per category, transit categories go into the transit group
  for (const cat of categories) cat.layer = cat.transit ? transit.layer : L.layerGroup(), cat.count = 0;
  let unmatched = 0;
  for (const p of data.points) {
    const cat = categories.find(c => c.match(p));
    if (!cat) { if (!zone.kinds[p.dataset]) unmatched++; continue; }
    cat.count++;

    let popup = `<div class="popup-title">${p.name}</div>`;
    if (p.props.address) popup += `<div class="popup-sub">${p.props.address}</div>`;
    if (p.props.zone) popup += `<div class="popup-sub">Zone ${p.props.zone.replace("+", "/")}</div>`;
    if (p.props.opening_hours) popup += `<div class="popup-sub">${p.props.opening_hours}</div>`;
    for (const id of p.props.lines ?? []) {
      popup += `<span class="chip" style="background:${(lineStyles[id] ?? defaultLineStyle).color}">${lineById[id]?.name ?? id}</span>`;
    }

    const marker = cat.icon
      ? L.marker([p.lat, p.lon], {
          zIndexOffset: cat.size * 100, // bigger icons on top
          icon: L.divIcon({
            className: "",
            iconSize: [cat.size, cat.size],
            html: `<div class="poi" style="width:${cat.size}px;height:${cat.size}px;font-size:${cat.size * 0.5}px;background:${cat.color};color:${cat.text ?? "#fff"}">${cat.icon}</div>`,
          }),
        })
      : L.circleMarker([p.lat, p.lon], { radius: cat.hover ?? cat.size, stroke: false, fillOpacity: 0 }); // invisible, catches the mouse
    if (!cat.icon) L.circleMarker([p.lat, p.lon], { radius: cat.size, color: cat.color, weight: 1.5, fillColor: "#fff", fillOpacity: 1, interactive: false }).addTo(cat.layer);
    // Hovering a station also shows the estimated time to each office
    let tooltip = p.name;
    for (const t of commute.times) if (t.minutes[p.id] != null) tooltip += `<br>${t.name}: ~${Math.round(t.minutes[p.id])} min`;
    marker.bindTooltip(tooltip).bindPopup(popup).addTo(cat.layer);
  }
  if (unmatched) console.warn(`${unmatched} points match no category and are hidden`);
  for (const cat of categories) if (cat.on) cat.layer.addTo(map);

  // Parks, zones, wards and dots are drawn on the same canvas as the lines, keep parks at the bottom, then wards, zones and dots on top
  const dotsToFront = () => {
    zone.layer.eachLayer(r => r.bringToBack());
    crime.layer.eachLayer(r => r.bringToBack());
    parks.layer.eachLayer(r => r.bringToBack());
    for (const cat of categories) if (!cat.icon) cat.layer.eachLayer(m => m.bringToFront());
  };
  dotsToFront();

  // Panel
  const catBox = document.getElementById("categories");
  for (const cat of categories) {
    if (cat.transit) continue;
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" ${cat.on ? "checked" : ""}> <span class="poi key" style="background:${cat.icon ? cat.color : "#fff"};color:${cat.text ?? "#fff"};border-color:${cat.icon ? "#fff" : cat.color}">${cat.icon ?? ""}</span> ${cat.label} <span class="count">${cat.count}</span>`;
    label.querySelector("input").onchange = e => {
      e.target.checked ? cat.layer.addTo(map) : cat.layer.remove();
      dotsToFront();
    };
    catBox.append(label);
  }
  const zoneLabel = document.createElement("label");
  zoneLabel.innerHTML = `<input type="checkbox" ${zone.on ? "checked" : ""}> <span class="key" style="width:18px;height:18px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:${zone.color};opacity:.6"></span> ${zone.label}`;
  zoneLabel.querySelector("input").onchange = e => {
    e.target.checked ? zone.layer.addTo(map) : zone.layer.remove();
    dotsToFront();
  };
  catBox.append(zoneLabel);
  const parksLabel = document.createElement("label");
  parksLabel.innerHTML = `<input type="checkbox" ${parks.on ? "checked" : ""}> <span class="key" style="width:18px;height:18px;flex:none;border-radius:3px;background:${parks.color};opacity:${parks.opacity + 0.3}"></span> ${parks.label}`;
  parksLabel.querySelector("input").onchange = e => {
    e.target.checked ? parks.layer.addTo(map) : parks.layer.remove();
    dotsToFront();
  };
  catBox.append(parksLabel);
  const crimeLabel = document.createElement("label");
  crimeLabel.innerHTML = `<input type="checkbox" ${crime.on ? "checked" : ""}> <span class="key" style="width:18px;height:18px;flex:none;border-radius:3px;background:${crime.color};opacity:.5"></span> ${crime.label}`;
  crimeLabel.querySelector("input").onchange = e => {
    e.target.checked ? crime.layer.addTo(map) : crime.layer.remove();
    dotsToFront();
  };
  catBox.append(crimeLabel);
  const socialLabel = document.createElement("label");
  socialLabel.innerHTML = `<input type="checkbox" ${social.on ? "checked" : ""}> <span class="key" style="width:18px;height:18px;flex:none;border-radius:3px;border:2px solid ${social.color};box-sizing:border-box"></span> ${social.label}`;
  socialLabel.querySelector("input").onchange = e => {
    e.target.checked ? social.layer.addTo(map) : social.layer.remove();
    dotsToFront();
  };
  catBox.append(socialLabel);
  const transitLabel = document.createElement("label");
  transitLabel.innerHTML = `<input type="checkbox" ${transit.on ? "checked" : ""}> <span class="poi key" style="background:${transit.color}">${transit.icon}</span> ${transit.label}`;
  transitLabel.querySelector("input").onchange = e => {
    e.target.checked ? transit.layer.addTo(map) : transit.layer.remove();
    dotsToFront();
  };
  catBox.append(transitLabel);
  document.getElementById("generated").textContent = "Data built " + new Date(data.generated_at).toLocaleString();
});
</script>
</body>
</html>
